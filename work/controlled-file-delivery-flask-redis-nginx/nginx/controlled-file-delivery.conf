# Sanitized reference configuration for downloads.example.invalid.
# Nginx is the public entry point; Gunicorn remains loopback-only.

upstream file_delivery_flask {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    server_name downloads.example.invalid;

    location ~ (^|/)\. {
        deny all;
    }

    location /download/ {
        proxy_pass http://file_delivery_flask;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;

        # Configured degraded/static fallback; it is not an availability guarantee.
        # It can bypass policy enforcement; fail closed if policy must remain mandatory.
        error_page 502 504 = @static_fallback;
    }

    location /protected-internal/ {
        internal;
        alias /srv/downloads/;
        autoindex off;
    }

    location @static_fallback {
        internal;
        rewrite ^/download/(.*)$ /protected-internal/$1 last;
    }
}
