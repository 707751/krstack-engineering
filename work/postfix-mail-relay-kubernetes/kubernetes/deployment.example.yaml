# Public-safe example only. Replace placeholders in a controlled environment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postfix-relay
  namespace: mail-platform
  labels:
    app: postfix-relay
spec:
  replicas: <REPLICA_COUNT>
  selector:
    matchLabels:
      app: postfix-relay
  template:
    metadata:
      labels:
        app: postfix-relay
    spec:
      # Illustrates deliberate workload placement with generic labels.
      nodeSelector:
        workload: mail-relay
      tolerations:
        - key: workload
          operator: Equal
          value: mail-relay
          effect: NoSchedule
      containers:
        - name: postfix-relay
          image: <POSTFIX_IMAGE>
          # Keep Postfix as the foreground process in the container.
          command: ["/bin/sh", "-c"]
          args: ["exec <POSTFIX_START_COMMAND>"]
          volumeMounts:
            - name: postfix-config
              mountPath: /etc/postfix
              readOnly: true
            - name: mail-logs
              mountPath: /var/log/mail
      volumes:
        - name: postfix-config
          configMap:
            name: postfix-relay-config
        - name: mail-logs
          persistentVolumeClaim:
            claimName: postfix-relay-logs
