version: "3.9"

services:
  web:
    build: .
    container_name: mcp-platform-web
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - ./instance:/app/instance
      - ./data:/app/data
    restart: unless-stopped

  admin:
    build: .
    container_name: mcp-platform-admin
    network_mode: "host"
    env_file:
      - .env
    command: uvicorn app.admin_panel:app --host 127.0.0.1 --port 8010
    volumes:
      - ./instance:/app/instance
      - ./data:/app/data
    restart: unless-stopped

  scheduler:
    build: .
    container_name: mcp-platform-scheduler
    network_mode: "host"
    env_file:
      - .env
    command: python app/scheduler.py
    volumes:
      - ./instance:/app/instance
      - ./data:/app/data
    restart: unless-stopped
